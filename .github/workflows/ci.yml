name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: halcyon_test
          POSTGRES_USER: halcyon
          POSTGRES_PASSWORD: halcyon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U halcyon -d halcyon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-change-before-deploy-2026
      DB_HOST: 127.0.0.1
      DB_NAME: halcyon_test
      DB_USER: halcyon
      DB_PASSWORD: halcyon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Lint
        run: flake8 .
      - name: Test and enforce coverage
        run: coverage run manage.py test inventory && coverage report --fail-under=80
      - name: Build application image
        run: docker build -t halcyon-inventory-api:${{ github.sha }} .