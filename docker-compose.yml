services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: halcyon
      POSTGRES_USER: halcyon
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halcyon -d halcyon"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-me}
      DJANGO_DEBUG: "false"
      DB_HOST: db
      DB_NAME: halcyon
      DB_USER: halcyon
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data: